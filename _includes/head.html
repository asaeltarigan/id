{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

{% if page.url == '/' %}
<link rel="alternate" hreflang="id" href="https://asaeltarigan.github.io/id/">
<link rel="alternate" hreflang="en" href="https://asaeltarigan.github.io/">
<link rel="alternate" hreflang="x-default" href="https://asaeltarigan.github.io/">
{% endif %}

{% assign site_url = site.url | append: site.baseurl %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
{% if page.url == "/" %}    {
      "@type": "WebSite",
      "@id": "{{ site_url }}/#website",
      "url": "{{ site_url }}/",
      "name": "Gabriel Asael Tarigan | Dosen dan Peneliti di BINUS University",
      "publisher": { "@id": "{{ site_url }}/#person" }
    },
    {
      "@type": "ProfilePage",
      "@id": "{{ site_url }}/#profile-page",
      "url": "{{ site_url }}/",
      "name": "Gabriel Asael Tarigan",
      "isPartOf": { "@id": "{{ site_url }}/#website" },
      "mainEntity": { "@id": "{{ site_url }}/#person" }
    },
{% endif %}    {
      "@type": "Person",
      "@id": "{{ site_url }}/#person",
      "name": "Gabriel Asael Tarigan",
      "alternateName": "Asael Tarigan",
      "givenName": "Gabriel Asael",
      "familyName": "Tarigan",
      "honorificSuffix": "S.Kom., M.Kom.",
      "jobTitle": "Dosen AI (Artificial Intelligence) di BINUS University",
      "worksFor": {
        "@type": "EducationalOrganization",
        "name": "BINUS University",
        "alternateName": "Universitas Bina Nusantara",
        "url": "https://socs.binus.ac.id/"
      },
      "alumniOf": [
        {
          "@type": "EducationalOrganization",
          "name": "BINUS University",
          "alternateName": "Universitas Bina Nusantara",
          "url": "https://binus.ac.id/"
        }
      ],
      "knowsLanguage": ["id", "en"],
      "knowsAbout": [
        "Artificial Intelligence",
        "Kecerdasan Buatan",
        "Machine Learning",
        "Pembelajaran Mesin",
        "Deep Learning",
        "Computer Vision",
        "MLOps",
        "Peramalan Deret Waktu"
      ],
      "url": "{{ site_url }}/",
      "identifier": "https://orcid.org/0009-0005-2246-5209",
      "sameAs": [
        "https://orcid.org/0009-0005-2246-5209",
        "https://scholar.google.com/citations?user=FCaQ7i0AAAAJ",
        "https://www.researchgate.net/profile/Gabriel-Asael-Tarigan",
        "https://www.linkedin.com/in/gabrielasael/",
        "https://asaeltarigan.medium.com/",
        "https://socs.binus.ac.id/artificial-intelligence/people/gabriel-asael-tarigan-s-kom-m-kom/",
        "https://github.com/asaeltarigan",
        "https://asaeltarigan.github.io/"
      ]
    }
  ]
}
</script>

{% unless page.header.image or page.header.overlay_image %}
  <meta property="og:image" content="{{ '/images/profile.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
  <meta name="twitter:image" content="{{ '/images/profile.jpg' | absolute_url }}">
{% endunless %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<link rel="stylesheet" href="{{ base_path }}/assets/css/custom.css?v=53">
